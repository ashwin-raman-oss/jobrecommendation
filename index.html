<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal — Ashwin's Job Search Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="wordmark">Signal<span class="wordmark-dot">.</span></div>
      <div class="masthead-meta">
        <span id="last-fetch">Last fetch: —</span>
        <span class="divider">·</span>
        <span id="job-count">0 roles tracked</span>
      </div>
    </div>
  </header>

  <main>
    <section class="top-five">
      <div class="section-label">
        <span class="eyebrow">Today's read</span>
        <h1>Top 5 matches</h1>
      </div>
      <div id="top-five-list" class="ladder"></div>
    </section>

    <section class="all-jobs">
      <div class="section-label">
        <span class="eyebrow">Full pull</span>
        <h2>Everything fetched</h2>
      </div>

      <div class="controls">
        <input id="search" type="text" placeholder="Search title or company…" />
        <select id="sort-by">
          <option value="score">Sort: best match</option>
          <option value="posted">Sort: newest</option>
        </select>
        <label class="toggle">
          <input type="checkbox" id="target-only" />
          Target companies only
        </label>
      </div>

      <table id="jobs-table">
        <thead>
          <tr>
            <th>Score</th>
            <th>Role</th>
            <th>Company</th>
            <th>Location</th>
            <th>Posted</th>
            <th>Why it scored</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="jobs-tbody"></tbody>
      </table>

      <p id="empty-state" class="empty-state" hidden>
        No roles fetched yet. Run the workflow once (Actions tab → Daily job fetch → Run workflow) to populate this.
      </p>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
