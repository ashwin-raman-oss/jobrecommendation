name: Daily job fetch

on:
  schedule:
    # 12:00 UTC = 7:00 AM Central (adjust for daylight saving as needed)
    - cron: "0 12 * * *"
  workflow_dispatch: {} # lets you trigger manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and score jobs
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node fetch-jobs.js

      - name: Commit updated jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --quiet --cached || git commit -m "Auto-update jobs — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
